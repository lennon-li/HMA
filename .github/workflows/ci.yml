# HMA's own verification gate. Every check here is one HMA requires of the
# work it gates, so the repository is held to its own contract.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: install bubblewrap
        # Several tests (credit sandboxing, host dogfood) require a real bwrap
        # sandbox; without it they fail with "sandbox unavailable: bwrap not found".
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 runners restrict unprivileged user namespaces via AppArmor
          # by default, which breaks bwrap's own network-namespace/loopback setup
          # ("bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted").
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt reports unformatted files:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -count=1 ./...

      - name: go test -race
        run: go test -count=1 -race ./...

      - name: fixture determinism
        # Deterministic fixtures must produce the same result on every run.
        run: go test -count=3 ./internal/engine/ ./internal/model/

      - name: host dogfood harness
        # Synthetic end-to-end run of the real hma host/transition CLIs in a
        # scratch store; jq is preinstalled on ubuntu-latest.
        run: bash scripts/dogfood/host-dogfood.sh

      - name: git diff --check
        run: git diff --check

      - name: worktree is clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "verification modified the worktree:"
            git status --porcelain
            exit 1
          fi
